# Linux starship.toml, cyan swapped for the ryha-silver border colour (#e5e5e5)
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #e5e5e5)"
success_symbol = "[❯](bold #e5e5e5)"

[directory]
style = "bold #e5e5e5"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #e5e5e5"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #e5e5e5"

[git_status]
format     = '[$all_status]($style)'
style      = "#e5e5e5"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
