# --- Apps ------------------------------------------------------------------
super - return                 : ~/.local/bin/term
super + alt - return           : ~/.local/bin/term /opt/homebrew/bin/tmux new -A -s Work
super + shift - b              : ~/.local/bin/wmctl opening; /Applications/Zen.app/Contents/MacOS/zen --new-window
super + shift - return         : ~/.local/bin/wmctl opening; /Applications/Zen.app/Contents/MacOS/zen --new-window
super + shift + alt - b        : ~/.local/bin/wmctl opening; /Applications/Zen.app/Contents/MacOS/zen --private-window
super + shift - f              : ~/.local/bin/wmctl opening; osascript -e 'tell application "Finder"' -e 'make new Finder window to home' -e 'activate' -e 'end tell'
super + shift - n              : ~/.local/bin/term /opt/homebrew/bin/nvim
super + shift - t              : ~/.local/bin/term /opt/homebrew/bin/btop
super + shift - g              : open -a Steam
# Discord, Spotify and KeePassXC live on the scratchpad (yabairc rules keep their windows there)
super + shift - c              : ~/.local/bin/wmctl pad show; open -a Discord
super + shift - m              : ~/.local/bin/wmctl pad show; open -a Spotify
super + shift - slash          : ~/.local/bin/wmctl pad show; open -a KeePassXC
# macOS Dictation: setup.sh gives it the hidden F19 shortcut, since it has no command to start it
super + alt - space            : send f19
# Screenshot: select an area, copied to the clipboard (macOS's own Ctrl+Option+Shift+4, see setup.sh, so nothing needs
# Screen Recording permission). Ctrl+Shift+4 saves the area to a file instead, Ctrl+Shift+5 opens the screenshot toolbar.
super + shift - s              : send ctrl + alt + shift - 4
# Control Center's menu bar items (shown by setup.sh), opened by .local/src/menu-extra.swift
super + ctrl - s               : ~/.local/bin/menu-extra Sound   # Sound menu: output device, volume
super + ctrl - b               : ~/.local/bin/menu-extra Bluetooth   # Bluetooth menu: devices, on/off
super - i                      : ~/.local/bin/term ~/.local/bin/keybinds   # keybinds, fzf to filter
super + shift - q              : open -a Calculator
# Raycast: clipboard history and emoji picker; SUPER+Escape: system menu (.local/src/power-menu.swift)
super + ctrl - v               : open -g "raycast://extensions/raycast/clipboard-history/clipboard-history"
super + ctrl - e               : open -g "raycast://extensions/raycast/emoji-symbols/search-emoji-symbols"
# Theme picker (Omarchy's theme menu key): Raycast extension in raycast-extension, running .local/bin/theme
super + ctrl + shift - space   : open -g "raycast://extensions/ryanahayden/hypr-mac-theme/switch-theme"
# Next wallpaper in the theme (Omarchy's key); Raycast's Set Wallpaper picks one from a grid
super + ctrl - space           : ~/.local/bin/theme wallpaper next
super - escape                 : ~/.local/bin/power-menu   # system menu (lock, sleep, keep awake, relaunch, power)
# Task manager: Activity Monitor (Ctrl+Shift+Esc like Windows; btop is SUPER+Shift+T)
ctrl + shift - escape          : open -a "Activity Monitor"
super + ctrl - t               : open -a "Activity Monitor"
super + ctrl - w               : ~/.local/bin/menu-extra Wi   # Wi-Fi menu (its name includes the connection state)
super + ctrl - n               : ~/.local/bin/night-shift   # toggle Night Shift (Omarchy nightlight)
super + ctrl - d               : open "x-apple.systempreferences:com.apple.Displays-Settings.extension"
super + ctrl - p               : ~/.local/bin/menu-extra Battery   # Battery menu


# --- Windows ---------------------------------------------------------------
# yabai-helper does these (wmctl sends it the command): close the window (Spotify/Discord quit), SIGKILL its app, quit
# the app (on Ghostty, which runs every terminal: close just this one)
super - w                      : ~/.local/bin/wmctl close
super + shift - w              : ~/.local/bin/wmctl kill
super - q                      : ~/.local/bin/wmctl quit
# Minimize without the macOS animation: park the window on a hidden Space (yabai-helper); Option brings back the
# latest (so does switching to its app, or picking it in AltTab)
super - m                      : ~/.local/bin/wmctl hide
super + alt - m                : ~/.local/bin/wmctl unhide
super + shift - p              : ~/.local/bin/yabai-pause   # pause/resume yabai (lets Cmd-drag reach macOS)
super - f                      : yabai -m window --toggle zoom-fullscreen
super + ctrl - f               : yabai -m window --toggle zoom-parent   # tiled fullscreen: fill its split only
super + alt - f                : yabai -m window --toggle native-fullscreen
super - t                      : yabai -m window --toggle float --grid 6:6:1:1:4:4
super - o                      : ~/.local/bin/window-pop   # pop out: float centered, sticky, on top (again: put back)
super + shift - o              : ~/.local/bin/focus-lock   # focus lock: new windows open without stealing focus (lock in the menu bar)
super - backslash              : yabai -m window --toggle split
super + shift - i              : yabai -m window --swap largest
super + ctrl + shift - i       : yabai -m space --mirror y-axis
# Resize by px like Omarchy: plain = width, Shift = height, Option = a little (25), Ctrl = a lot (300)
super - minus                  : repeat ~/.local/bin/wmctl resize w -100
super - equal                  : repeat ~/.local/bin/wmctl resize w 100
super + shift - minus          : repeat ~/.local/bin/wmctl resize h -100
super + shift - equal          : repeat ~/.local/bin/wmctl resize h 100
super + alt - minus            : repeat ~/.local/bin/wmctl resize w -25
super + alt - equal            : repeat ~/.local/bin/wmctl resize w 25
super + shift + alt - minus    : repeat ~/.local/bin/wmctl resize h -25
super + shift + alt - equal    : repeat ~/.local/bin/wmctl resize h 25
super + ctrl - minus           : repeat ~/.local/bin/wmctl resize w -300
super + ctrl - equal           : repeat ~/.local/bin/wmctl resize w 300
super + ctrl + shift - minus   : repeat ~/.local/bin/wmctl resize h -300
super + ctrl + shift - equal   : repeat ~/.local/bin/wmctl resize h 300
super + shift - r              : yabai -m space --balance
super + shift - space          : ~/.local/bin/toggle-menubar
super - backspace              : ~/.local/bin/window-opacity toggle   # Backspace: focused window stays opaque when unfocused, on/off
super + alt - backspace        : repeat ~/.local/bin/window-opacity -0.05
super + shift + alt - backspace : repeat ~/.local/bin/window-opacity +0.05
super + shift - backspace      : ~/.local/bin/quadrant-tile   # no gaps/borders, every Space
super + alt - l                : ~/.local/bin/space-layout        # bsp -> stack -> float
super + alt + shift - l        : ~/.local/bin/space-layout back

# Groups (Omarchy tabs) = yabai stacks
super - g                      : ~/.local/bin/wmctl group toggle
super + alt - left             : ~/.local/bin/wmctl group into west
super + alt - right            : ~/.local/bin/wmctl group into east
super + alt - up               : ~/.local/bin/wmctl group into north
super + alt - down             : ~/.local/bin/wmctl group into south
# Option+Tab cycles focus through the windows on this workspace (Cmd+Tab = SUPER+Tab is AltTab, all windows)
alt - tab                      : repeat ~/.local/bin/wmctl cycle next
shift + alt - tab              : repeat ~/.local/bin/wmctl cycle prev
super + alt - tab              : repeat ~/.local/bin/wmctl group next
super + alt + shift - tab      : repeat ~/.local/bin/wmctl group prev
super + ctrl - left            : repeat ~/.local/bin/wmctl group prev
super + ctrl - right           : repeat ~/.local/bin/wmctl group next

# Scratchpad = 11th Space: SUPER+S goes there and back, +Option sends the window there (from it: back)
super - s                      : ~/.local/bin/wmctl pad toggle
super + alt - s                : ~/.local/bin/wmctl pad move

# Focus (vim keys + arrows)
super - h                      : repeat yabai -m window --focus west
super - j                      : repeat yabai -m window --focus south
super - k                      : repeat yabai -m window --focus north
super - l                      : repeat yabai -m window --focus east
super - left                   : repeat yabai -m window --focus west
super - down                   : repeat yabai -m window --focus south
super - up                     : repeat yabai -m window --focus north
super - right                  : repeat yabai -m window --focus east

# Move (like Hyprland movewindow: re-split into that side)
super + shift - h              : yabai -m window --warp west
super + shift - j              : yabai -m window --warp south
super + shift - k              : yabai -m window --warp north
super + shift - l              : yabai -m window --warp east
super + shift - left           : yabai -m window --swap west
super + shift - down           : yabai -m window --swap south
super + shift - up             : yabai -m window --swap north
super + shift - right          : yabai -m window --swap east

# --- Workspaces (Spaces) ---------------------------------------------------
# yabai-helper does these (wmctl sends it the command; one at a time, in the order pressed)
super - a                      : repeat ~/.local/bin/wmctl ws focus prev
super - d                      : repeat ~/.local/bin/wmctl ws focus next
super + shift - a              : repeat ~/.local/bin/wmctl ws move prev
super + shift - d              : repeat ~/.local/bin/wmctl ws move next

super - 1 : ~/.local/bin/wmctl ws focus 1
super - 2 : ~/.local/bin/wmctl ws focus 2
super - 3 : ~/.local/bin/wmctl ws focus 3
super - 4 : ~/.local/bin/wmctl ws focus 4
super - 5 : ~/.local/bin/wmctl ws focus 5
super - 6 : ~/.local/bin/wmctl ws focus 6
super - 7 : ~/.local/bin/wmctl ws focus 7
super - 8 : ~/.local/bin/wmctl ws focus 8
super - 9 : ~/.local/bin/wmctl ws focus 9
super - 0 : ~/.local/bin/wmctl ws focus 10

# Move window to Space N and follow: yabai-helper switches and moves back to back over yabai's socket (no flash)
super + shift - 1 : ~/.local/bin/wmctl ws move 1
super + shift - 2 : ~/.local/bin/wmctl ws move 2
super + shift - 3 : ~/.local/bin/wmctl ws move 3
super + shift - 4 : ~/.local/bin/wmctl ws move 4
super + shift - 5 : ~/.local/bin/wmctl ws move 5
super + shift - 6 : ~/.local/bin/wmctl ws move 6
super + shift - 7 : ~/.local/bin/wmctl ws move 7
super + shift - 8 : ~/.local/bin/wmctl ws move 8
super + shift - 9 : ~/.local/bin/wmctl ws move 9
super + shift - 0 : ~/.local/bin/wmctl ws move 10


# SUPER+Shift+Option+N: move window there silently (stay here)
super + shift + alt - 1 : ~/.local/bin/wmctl ws silent 1
super + shift + alt - 2 : ~/.local/bin/wmctl ws silent 2
super + shift + alt - 3 : ~/.local/bin/wmctl ws silent 3
super + shift + alt - 4 : ~/.local/bin/wmctl ws silent 4
super + shift + alt - 5 : ~/.local/bin/wmctl ws silent 5
super + shift + alt - 6 : ~/.local/bin/wmctl ws silent 6
super + shift + alt - 7 : ~/.local/bin/wmctl ws silent 7
super + shift + alt - 8 : ~/.local/bin/wmctl ws silent 8
super + shift + alt - 9 : ~/.local/bin/wmctl ws silent 9
super + shift + alt - 0 : ~/.local/bin/wmctl ws silent 10

super + ctrl - tab   : ~/.local/bin/wmctl ws focus recent   # the Space you were on before

# Move window to the other display
super + ctrl + shift - h             : yabai -m window --display west; yabai -m display --focus west
super + ctrl + shift - l             : yabai -m window --display east; yabai -m display --focus east
super + ctrl + shift - k                : yabai -m window --display north; yabai -m display --focus north
super + ctrl + shift - j                : yabai -m window --display south; yabai -m display --focus south
super + ctrl + shift - left          : yabai -m window --display west; yabai -m display --focus west
super + ctrl + shift - right         : yabai -m window --display east; yabai -m display --focus east
super + ctrl + shift - up               : yabai -m window --display north; yabai -m display --focus north
super + ctrl + shift - down             : yabai -m window --display south; yabai -m display --focus south
ctrl + alt - tab                     : yabai -m display --focus next || yabai -m display --focus first
ctrl + alt + shift - tab             : yabai -m display --focus prev || yabai -m display --focus last
# Move this whole Space to the other display (renumbers Spaces: workspace numbers follow display order)
super + shift + alt - left           : yabai -m space --display west; yabai -m display --focus west
super + shift + alt - right          : yabai -m space --display east; yabai -m display --focus east
super + shift + alt - up             : yabai -m space --display north; yabai -m display --focus north
super + shift + alt - down           : yabai -m space --display south; yabai -m display --focus south
# Mirror displays: macOS's own Cmd+F1 (Cmd+brightness-down) shortcut
super + ctrl - m                     : send cmd - f1

# --- System ----------------------------------------------------------------
super + ctrl - l               : pmset displaysleepnow
super + alt - y                : yabai --restart-service; ~/.local/bin/binds-apply


# --- Omarchy utilities -------------------------------------------------------
# Capture menu: macOS's screenshot/recording toolbar (its own Ctrl+Shift+5, see setup.sh)
super + ctrl - c                     : send ctrl + shift - 5
# Notifications (SUPER+comma family). Left Cmd+, is taken from apps' Settings; right Cmd+, still opens them.
super - comma                        : ~/.local/bin/notifications dismiss
super + alt - comma                  : ~/.local/bin/notifications dismiss
super + shift - comma                : ~/.local/bin/notifications dismiss-all
super + ctrl - comma                 : ~/.local/bin/notifications center
super + shift + alt - comma          : ~/.local/bin/notifications center
# Display scaling: step through the Retina "Looks like" sizes. Right Cmd+/ still reaches apps (comment toggle).
super - slash                        : ~/.local/bin/display-scale up
super + alt - slash                  : ~/.local/bin/display-scale down
